# Pull my real works and their numbers into the site, once a day
#
# Runs tools/sync_data.py, which asks GitHub, YouTube, Bilibili and Pixiv
# what I have published and how each work is doing, then commits whatever
# changed: cards/live.js, cards/history.json and any new cover pictures.
# The site reads those files as they are; there is no server anywhere.
#
# Secrets (repo -> Settings -> Secrets and variables -> Actions):
#   YOUTUBE_API_KEY       YouTube Data API v3 key (without it: only the newest 15 videos)
#   PIXIV_REFRESH_TOKEN   Pixiv login for its app API (without it: Pixiv is skipped)
#
# GitHub and Bilibili need no secrets.
#
# GitHub switches a scheduled workflow off after 60 days in which nothing
# happens in the repository. This one commits every day, so it stays on.

name: sync data

on:
  schedule:
    - cron: "0 4 * * *"      # daily at 04:00 UTC
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: write             # let the bot commit the data back

concurrency:
  group: sync-data            # never two runs at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pixivpy3 (Pixiv only)
        run: pip install "pixivpy3==3.7.5"   # pinned: a newer version must not change the daily run by surprise

      - name: Pull works and numbers from the four accounts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIXIV_REFRESH_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}
        run: python3 tools/sync_data.py

      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: daily data sync"
            git push || (git pull --rebase && git push)
          fi
