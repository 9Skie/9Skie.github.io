<!DOCTYPE html>
<html lang="en" class="fx-type fx-align fx-grid fx-calm fx-icons fx-dither fx-marks fx-vignette fx-day fx-nocgi fx-beside bg-depth lab-fixes" style="--vignette: 0.75"><!-- the look: css/look.css -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAY WORLD_</title>
  <meta name="description" content="Just a moth who chases the flames" />

  <!-- pixel display font for labels; body text is strict monospace (see CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=9" />
  <link rel="stylesheet" href="css/look.css?v=1" />

  <!-- three.js draws the low-poly objects on the stream tiles (js/objects.js). pinned version, no build step -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- background texture layer (flat blocks + bars, drawn by JS) -->
  <canvas class="bg-blocks" id="bg-blocks" aria-hidden="true"></canvas>
  <!-- the background with depth (js/field.js); the flat one above is its fallback -->
  <canvas class="bg-blocks" id="depth-field" aria-hidden="true"></canvas>

  <!-- top HUD bar -->
  <header class="hud hud--top">
    <span class="hud__l">▌SYS://GRAY-WORLD</span>
    <span class="hud__c"><span class="dot">●</span> LINK : STABLE</span>
    <span class="hud__r"><button class="hud__toggle" id="night-toggle" type="button" title="toggle day/night" aria-label="toggle day/night"></button> <span id="hud-clock">--:--:--</span></span>
  </header>

  <main class="page">

    <!-- title screen -->
    <section class="hero" id="top">
      <h1 class="title" aria-label="GRAY WORLD">
        <span class="title__w" data-text="GRAY" aria-hidden="true">GRAY</span>
        <span class="title__w" data-text="WORLD_" aria-hidden="true">WORLD<span class="cursor">_</span></span>
      </h1>
      <p class="hero__tag">Just a moth who chases the flames</p>
      <a class="hero__cue" href="#who" aria-label="scroll to content"><span class="hero__arrow">▼</span> SCROLL</a>
    </section>

    <!-- who am i: description (left) + image (right, mirrored) -->
    <section class="block" id="who">
      <h2 class="head"><span class="head__no">01</span><span class="head__t">Who am I<span class="cursor">_</span></span></h2>
      <div class="middle middle--mirror">
        <div class="whoami__desc">
          <p data-fill="bio">…</p>
        </div>
        <div class="slot">
          <div class="slot__box">
            <img class="slot__img" src="assets/pfp.jpg?v=928c9aba" alt="profile photo" />
          </div>
        </div>
      </div>
    </section>

    <!-- what I love: heart painting (left) + roots (right) -->
    <section class="block" id="love">
      <h2 class="head"><span class="head__no">02</span><span class="head__t">What I Love<span class="cursor">_</span></span></h2>
      <div class="middle">
        <div class="slot">
          <div class="slot__box">
            <img class="slot__img" src="assets/heart.jpg?v=dcfa8a39" alt="low-poly heart" />
          </div>
        </div>
        <div class="feed">
          <dl class="feed__list" id="feed"><!-- filled by JS --></dl>
        </div>
      </div>
    </section>

    <!-- things I've done: stream selector + the selected stream -->
    <section class="block" id="selector">
      <h2 class="head"><span class="head__no">03</span><span class="head__t">Things I've Done<span class="cursor">_</span></span></h2>
      <div class="select__list" id="stream-list"><!-- filled by JS --></div>

      <div class="stream-panel" id="stream-view">
        <div class="aggregate">
          <span class="aggregate__glyph" id="agg-glyph">★</span>
          <span class="aggregate__num" id="agg-num">0</span>
          <span class="aggregate__label" id="agg-label">—</span>
        </div>
        <div class="stream-controls">
          <label class="searchbar">
            <span class="searchbar__prompt">&gt;_</span>
            <input type="search" id="search" placeholder="filter this stream..." aria-label="filter cards" autocomplete="off">
          </label>
          <button class="ctrl-btn" id="deck-top" type="button" title="back to the stream tiles" aria-label="back to the stream tiles">↑</button>
        </div>
        <div class="deck" id="cards">
          <div class="timeline-track" id="timeline"><!-- JS: entries --></div>

          <div class="offlimits" aria-label="off limits">
            <div class="offlimits__band"><span>OFF LIMITS<span class="cursor">_</span></span></div>
          </div>
          <!-- what the line means, for visitors. Shown only when there is something below it. -->
          <p class="offlimits__note">Everything below is from before I synced this site with the platforms I post on.</p>

          <div class="timeline-track cards--archive" id="archive" aria-label="archive"><!-- JS: archive entries --></div>
        </div>
      </div>
    </section>

  </main>

  <!-- bottom HUD bar -->
  <footer class="hud hud--bot">
    <span class="hud__l">現実逃避P</span>
    <span class="hud__c" id="hud-dots">● ○ ○</span>
    <span class="hud__r">灰色地带<span class="cursor">_</span></span>
  </footer>

  <script src="js/data.js?v=6"></script>
  <script src="js/card.js?v=8"></script>
  <script src="js/hydrate.js?v=1"></script>
  <script src="cards/live.js"></script><!-- my real works and their numbers; written daily by tools/sync_data.py; ok if missing -->
  <script src="cards/1 cs/cards.js?v=10"></script>
  <script src="cards/2 art/cards.js?v=7"></script>
  <script src="cards/3 videos/cards.js?v=7"></script>
  <script src="js/main.js?v=12"></script><!-- loads js/objects.js (the 3D tile objects) once the page is up -->
  <script src="js/field.js?v=1"></script>
  <script src="js/look.js?v=1"></script>
</body>
</html>
